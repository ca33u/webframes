name: Feature request
description: Describe a workflow that Web Frames could improve.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow and where you get stuck. Avoid private project details.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired result
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround or alternatives
