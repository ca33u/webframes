name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: Tools/component-catalog/package-lock.json
      - name: Install component catalog dependencies
        run: npm ci --ignore-scripts --prefix Tools/component-catalog
      - name: Test
        run: npm test --prefix Tools

  swift:
    name: macOS app
    # The project is maintained with Xcode 27; use the newest Xcode on the image.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Prepare bundled Node runtime
        run: python3 Tools/prepare_runtime.py
      - name: Unit tests
        # KeychainHelperTests write to the login keychain and
        # realLocalhostCaptureApplyReloadUndo drives a WKWebView window;
        # both run locally before a release instead.
        run: |
          xcodebuild test \
            -project webframes.xcodeproj -scheme webframes \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DD \
            -resultBundlePath build/tests.xcresult \
            -only-testing:webframesTests \
            -skip-testing:webframesTests/KeychainHelperTests \
            '-skip-testing:webframesTests/AstraTests/realLocalhostCaptureApplyReloadUndo()' \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/tests.xcresult
          if-no-files-found: ignore
